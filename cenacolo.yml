name: Vigilante Cenacolo

on:
  schedule:
    # Todas las horas en punto (UTC). Cobertura base de cancelaciones.
    - cron: "0 * * * *"
    # Refuerzo del miercoles: liberacion semanal a las 12:00 hora de Italia.
    # Octubre 2026 va en CEST (UTC+2), asi que 12:00 Madrid = 10:00 UTC.
    - cron: "50,55 9 * * 3"
    - cron: "0,5,10,20 10 * * 3"
  workflow_dispatch: {}

# Si un run se solapa con el anterior, cancela el viejo.
concurrency:
  group: cenacolo
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Recuerda entre ejecuciones de que ya te avise, para no repetir.
      - name: Restaurar estado
        uses: actions/cache@v5
        with:
          path: state.json
          key: cenacolo-state-${{ github.run_id }}
          restore-keys: |
            cenacolo-state-

      - name: Instalar Playwright
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Comprobar disponibilidad
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_cenacolo.py
